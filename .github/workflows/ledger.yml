name: Ironbound Ledger

on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes
    - cron: "10 16 * * *"      # daily at 11:10 AM EST (winter)
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview missing receipts, or publish a bounded catch-up batch"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - publish

permissions:
  contents: write

concurrency:
  group: ironbound-ledger-publisher
  cancel-in-progress: false

jobs:
  run-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Test ledger
        run: python -m unittest -v test_ledger

      - name: Run ledger
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          DISCORD_WEBHOOK_WAIVERS: ${{ secrets.DISCORD_WEBHOOK_WAIVERS }}
          DISCORD_WEBHOOK_TRADES: ${{ secrets.DISCORD_WEBHOOK_TRADES }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "preview" ]; then
            python ledger.py --preview
          else
            python ledger.py --batch-limit 8
          fi

      - name: Commit updated state.json (if changed)
        if: ${{ always() }}
        run: |
          if git status --porcelain | grep -q "state.json"; then
            git config user.name "ironbound-ledger-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update ledger state"
            git push
          else
            echo "No state changes."
          fi
